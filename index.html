<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 사파리 탭에 표시되는 이름 -->
    <title>Bubbles</title>
    <link rel="manifest" href="manifest.json">
    <!-- 아이폰 바탕화면 아이콘 설정 -->
    <link rel="apple-touch-icon" href="icon.png">
    <!-- 아이폰 홈 화면에 추가될 때 표시되는 이름 강제 지정 -->
    <meta name="apple-mobile-web-app-title" content="Bubbles">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- 터치할 때마다 여기에 동그라미가 생깁니다 -->
    </div>
    
    <!-- 하단 UI 정보창 영문 변경 및 포맷 수정 -->
    <div id="info-panel">
        <div id="time-display">Time: <span id="time-count">00:00:00</span></div>
        <div id="touch-display">Hit: <span id="touch-count">0</span></div>

    <script src="app.js"></script>
</body>
</html>
